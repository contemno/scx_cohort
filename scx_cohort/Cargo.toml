[package]
name = "scx_cohort"
description = "A CCD-affine sched_ext scheduler: discovers groups of related tasks (cohorts), gives each a home CCD, and crosses the Infinity Fabric only when the math clearly favors it"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
crossbeam = "0.8"
ctrlc = { version = "3", features = ["termination"] }
globset = "0.4.20"
libbpf-rs = "=0.27.0"
libc = "0.2"
log = "0.4"
scx_cohort_common = { path = "../scx_cohort_common" }
scx_stats = "1.1.2"
scx_stats_derive = "1.1.2"
scx_utils = "1.1.2"
serde = { version = "1.0.229", features = ["derive"] }
simplelog = "0.12"
toml = "1.1.4"
zerocopy = "0.8"

[build-dependencies]
scx_cargo = "1.1.2"
cbindgen = "0.29"
