name: CI

# ── Repo-standard CI ─────────────────────────────────────────────────────────
# Classify the diff ONCE, then gate each area's jobs with `if:` so unrelated
# jobs SKIP. Required checks must stay reachable: a check that never reports
# wedges the PR ("waiting for status"); a SKIPPED required job satisfies branch
# protection. So we never use `paths-ignore` on required jobs — we skip via `if:`.
# See repo_standard's STANDARD.md → "Skip, don't ignore" and "The aggregator gate".
#
# Required checks to set in branch protection: `rust` (the aggregator, NOT
# rust-lint/rust-test) and `scripts`.
#
# Promotion flow: feature -> dev -> main. Gate PRs into BOTH dev and main.
on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

# Cancel superseded runs for the same PR when new commits are pushed.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Classify changed paths -> one boolean output per area. Anything unrecognized
  # (build infra, CI itself, systemd units) flips every area on, so a
  # misclassified change fails safe toward running MORE, not less.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0  # need the base commit to diff against

      - name: Classify changed paths
        id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          files="$(git diff --name-only "${BASE}"...HEAD)"
          echo "Changed files:"; echo "${files:-<none>}"
          rust=false scripts=false other=false
          # Empty diff -> treat as infra change and run everything.
          [ -z "$files" ] && other=true
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              *.md|LICENSE) ;;                 # docs -> ignore
              # Cargo workspace: the daemon, the shared-types crate (whose
              # layout feeds the cbindgen-generated BPF header), the BPF C
              # source compiled by build.rs, and the bench workspace member.
              Cargo.toml|Cargo.lock|rust-toolchain*|scx_cohort/*|scx_cohort_common/*|bench/ipc_pingpong/*) rust=true ;;
              # Stdlib-only Python analyzer + shell helpers.
              bench/analyze.py|bench/run-suite.sh|scripts/*) scripts=true ;;
              # The Makefile holds both areas' checked-file lists.
              Makefile) rust=true; scripts=true ;;
              *) other=true ;;                 # infra -> run everything
            esac
          done <<< "$files"
          $other && { rust=true; scripts=true; }
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "scripts=$scripts" >> "$GITHUB_OUTPUT"
          echo "rust=$rust scripts=$scripts (other=$other)"

  # ── A simple, single required check per area ────────────────────────────────
  # Set `scripts` as a required status check in branch protection. It skips
  # (and so passes) on PRs that don't touch the bench/helper scripts.
  scripts:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - run: make lint-scripts

  # ── The required `rust` check FANS OUT into parallel jobs + an aggregator ───
  # Protect the `rust` aggregator name (below), NOT rust-lint/rust-test.
  # This lets you reshape the fan-out without touching branch-protection.
  #
  # Both jobs need the BPF toolchain: clippy and cargo test both run build.rs,
  # which generates intf.h via cbindgen and compiles main.bpf.c against the
  # vendored libbpf (clang + libelf + zlib).
  rust-lint:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Install BPF build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libelf-dev zlib1g-dev
      - run: rustup update stable && rustup default stable
      - run: make lint-rust

  rust-test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Install BPF build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libelf-dev zlib1g-dev
      - run: rustup update stable && rustup default stable
      - run: make test

  # Aggregator: the single required `rust` check. `if: always()` makes it run
  # even when an upstream job fails, so it FAILS the check — a plain `needs` job
  # would be reported "skipped", which branch protection treats as PASSING.
  rust:
    needs: [changes, rust-lint, rust-test]
    if: always() && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Require rust-lint and rust-test to pass
        run: |
          echo "lint=${{ needs.rust-lint.result }} test=${{ needs.rust-test.result }}"
          [ "${{ needs.rust-lint.result }}" = "success" ] || exit 1
          [ "${{ needs.rust-test.result }}" = "success" ] || exit 1
