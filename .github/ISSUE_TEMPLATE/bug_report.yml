name: 🐞 Bug report
description: Something is broken or behaves unexpectedly
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please fill in as much as you can — logs and
        environment details are the most useful parts for diagnosing problems.

        **Never paste secrets.** Journald output can include command lines and
        cgroup paths of everything running on your machine — skim what you
        paste and scrub anything private (tokens, hostnames, usernames).

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight
      options:
        - label: I searched existing issues and this isn't a duplicate
          required: true
        - label: This is a bug, not a usage question (those go to Discussions)
          required: true
        - label: This is not a security vulnerability (those go to a private advisory)
          required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      description: Where does the problem appear? Pick the closest match.
      multiple: true
      options:
        - BPF scheduler (main.bpf.c — CPU selection, DSQs, stealing)
        - Daemon / load balancer (cohort moves, spill)
        - Cohort discovery (fork lineage, wake graph, merge/split)
        - Config & rules (TOML, CLI flags)
        - Stats / top / monitoring
        - Shared types (scx_cohort_common / generated intf.h)
        - systemd service / packaging
        - Build / release pipeline
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the actual behavior, including any error text.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: >-
        Running as a service: `journalctl --namespace scx-cohort -u scx_cohort
        --no-pager -n 200`. Running by hand: rerun with `-vv` (includes the
        libbpf/verifier log for load failures). Scrub anything secret.
      render: shell

  - type: input
    id: version
    attributes:
      label: Version
      description: Release, tag, or git commit.
      placeholder: "e.g. v0.1.0, or commit af37d21"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "kernel (uname -r), CPU model (e.g. 7950X), distro, clang/rustc versions if a build issue"
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: >-
        `scx_cohort top` output, `--monitor` metrics, config file snippets,
        related issues.
