name: 🐞 Bug report
description: Something is broken or behaves unexpectedly
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please fill in as much as you can — logs and
        environment details are the most useful parts for diagnosing problems.

        ⚠️ When pasting logs, scrub anything secret (tokens, hostnames you
        care about, usernames). `journalctl` output can include command lines
        of every task the scheduler touched.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight
      options:
        - label: I searched existing issues and this isn't a duplicate
          required: true
        - label: This is a bug, not a usage question (those go to Discussions)
          required: true
        - label: This is not a security vulnerability (those go to a private advisory)
          required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      description: Where does the problem appear? Pick the closest match.
      multiple: true
      options:
        - BPF scheduler (scx_cohort/src/bpf/main.bpf.c — dispatch, CPU selection, stealing)
        - Daemon policy (balancer, wake-graph clustering, spill, TOML rules)
        - Metrics / stats (scx_stats server, --top)
        - Shared types / ABI (scx_cohort_common, generated intf.h)
        - Build (build.rs, cbindgen, vendored libbpf, Cargo)
        - Benchmarks (bench/)
        - systemd service / packaging
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the actual behavior, including any error text.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: >-
        Under systemd: `journalctl -u scx_cohort --no-pager -n 200`. If the
        scheduler ejected, also include `dmesg | grep -i sched_ext`. Scrub
        anything secret before pasting.
      render: shell

  - type: input
    id: version
    attributes:
      label: Version
      description: Release, tag, or git commit.
      placeholder: "e.g. v0.1.0, or commit af37d21"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Kernel, CPU, and toolchain if it's a build problem.
      placeholder: "e.g. Linux 6.12.8, Ryzen 9 7950X, clang 18, rustc 1.84"
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Workload (Chrome, a game under Proton, …), config snippets, related issues.
