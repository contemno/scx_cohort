# Journald configuration for the scx-cohort log namespace
# (install to /etc/systemd/journald@scx-cohort.conf).
#
# The scheduler's logs are diagnostic chatter with little long-term value:
# keep them in RAM, capped at one hour and 64M, isolated from the main
# journal.
[Journal]
Storage=volatile
MaxRetentionSec=1h
RuntimeMaxUse=64M
