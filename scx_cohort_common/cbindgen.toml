language = "C"
include_guard = "__SCX_COHORT_INTF_H"
no_includes = true
style = "both"
usize_is_size_t = false
header = """/* Generated by cbindgen from scx_cohort_common — do not edit.
 *
 * Consumed by the BPF component after <scx/common.bpf.h> (which provides
 * the kernel __u* types via vmlinux.h). Redundant typedefs are legal C11,
 * so this is safe even if uint*_t are already defined. */
#ifdef __VMLINUX_H__
typedef __u8  uint8_t;
typedef __u16 uint16_t;
typedef __u32 uint32_t;
typedef __u64 uint64_t;
typedef __s8  int8_t;
typedef __s16 int16_t;
typedef __s32 int32_t;
typedef __s64 int64_t;
#else
#include <stdint.h>
#endif"""

[export]
include = ["TaskCtx", "CohortCtx", "WakeEdgeKey", "TaskStat", "Tunables"]

[const]
allow_static_const = false
allow_constexpr = false
